<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060208">
  <meta name="description" content="A heart made of love, for Mary.">
  <title>For Mary ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="intro" aria-labelledby="message">
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>
      <div class="message-card">
        <span class="tiny-heart" aria-hidden="true">♥</span>
        <p id="message">میدونم روز دختر گذشت و میدونم خیلی کادوی بهتری باید بهت میدادم ولی قول میدم یه روز بهترینارو برات بگیرم</p>
        <button id="start-button" type="button">برای دیدن قلب، کلیک کن</button>
        <span class="wait-note">یا چند لحظه صبر کن</span>
      </div>
    </section>

    <canvas id="heart" aria-label="An animated heart made from love messages for Mary"></canvas>
  </main>
  <script src="app.js"></script>
</body>
</html>
